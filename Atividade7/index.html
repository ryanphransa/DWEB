<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pedra, Papel ou Tesoura</title>
</head>
<body>

    <main class="jogo">
        <h1>Pedra, Papel ou Tesoura</h1>
        <p>Escolha uma opção para jogar contra o computador:</p>

        <div class="botoes">
            <button onclick="jogar(0)">Pedra</button>
            <button onclick="jogar(1)">Papel</button>
            <button onclick="jogar(2)">Tesoura</button>
        </div>

        <div class="resultado">
            <p id="escolhaUsuario"></p>
            <p id="escolhaComputador"></p>
            <h2 id="resultado"></h2>
        </div>

        <div class="placar">
            <p>Vitórias: <span id="vitorias">0</span> | Empates: <span id="empates">0</span> | Derrotas: <span id="derrotas">0</span></p>
</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
